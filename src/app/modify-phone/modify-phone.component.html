<form [formGroup]="phoneForm" (ngSubmit)="onSubmit()" class="mat-form">


  <mat-form-field appearance="outline" class="form-field" disabled [appFocus]="'green'">
    <mat-label>Phone ID</mat-label>
    <input matInput type="number" formControlName="id" matTooltip="Add a phone ID"/>
  </mat-form-field>

\
  <mat-form-field appearance="outline" class="form-field" [appFocus]="'green'">
    <mat-label>Phone Model</mat-label>
    <input matInput type="text" formControlName="model" matTooltip="Add phone model"/>
  </mat-form-field>


  <mat-form-field appearance="outline" class="form-field" [appFocus]="'green'">
    <mat-label>Phone Brand</mat-label>
    <input matInput type="text" formControlName="brand" matTooltip="Add phone brand"/>
  </mat-form-field>


  <mat-form-field appearance="outline" class="form-field" [appFocus]="'green'">
    <mat-label>Phone Price</mat-label>
    <input matInput type="number" formControlName="price" matTooltip="Add phone price"/>
  </mat-form-field>


  <mat-checkbox formControlName="isSmartPhone" matTooltip="Check if smartphone">Smartphone</mat-checkbox>

  <div class="form-buttons">
    <!-- Submit button -->
    <button type="submit" class="btn submit-btn">Submit</button>
  </div>

</form>
